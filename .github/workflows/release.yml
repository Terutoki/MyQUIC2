name: Release

# Publishes a GitHub Release with ready-to-run x86_64 Linux binaries.
#
# Trigger: push a tag like `v0.1.0`, or run the workflow manually and pass
# the tag (the tag is created from the selected commit if it does not exist).
#
# Builds are profile-guided (PGO): a training job per target triple builds
# instrumented server/client binaries (plus the bench harness), runs the same
# loopback workload `scripts/pgo.sh` uses on a dev box — byte-verified TCP
# echo, a TCP connect burst, the UDP sweep (fragment path included) and a
# short `udpps` blast — merges the raw profiles with llvm-profdata and hands
# the merged `.profdata` to the packaging jobs via `-Cprofile-use`. Training
# deliberately uses a *generic* x86-64 instrumented build even for the v2..v4
# legs: instrumentation profiles are function-hash based, so LLVM simply
# drops functions whose control flow differs under another `target-cpu`,
# while a v3/v4 instrumented binary would SIGILL on runner CPUs without
# AVX-512. Profiles are per-triple by construction — musl and gnu each train
# their own, and none is ever reused across architectures.
#
# Assets:
#   myquic2-<tag>-x86_64-unknown-linux-musl.tar.gz   static, any x86_64 Linux
#   myquic2-<tag>-x86_64-unknown-linux-gnu.tar.gz    glibc build (2.36+ floor)
#   myquic2-<tag>-openwrt-x86_64-v1..v4.tar.gz       static musl, CPU levels
#   SHA256SUMS                                       checksums for all assets
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: verify
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  # One PGO training job per target triple. The instrumented binaries are
  # static musl / dynamically linked gnu, so they run directly on the runner;
  # the merged profile artifact is the only thing the packaging legs consume.
  pgo-musl:
    name: PGO training (static musl)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
          components: llvm-tools-preview
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: pgo-musl
      - name: Build instrumented binaries and training harness
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-musl
        run: |
          set -euo pipefail
          mkdir -p "$PROFILE_DIR"
          cargo zigbuild --release \
            --target x86_64-unknown-linux-musl \
            --config "target.x86_64-unknown-linux-musl.rustflags=[\"-C\", \"profile-generate=$PROFILE_DIR\"]" \
            --bin myquic2-server --bin myquic2-client --example hotpath_bench
      - name: Train on loopback
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-musl
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release
          bench="$bin/examples/hotpath_bench"

          "$bench" echo 19290 >/dev/null 2>&1 & echo_pid=$!
          "$bench" techo 19291 >/dev/null 2>&1 & techo_pid=$!
          RUST_LOG=warn "$bin/myquic2-server" --config config-server.toml >server.log 2>&1 & server_pid=$!
          sleep 1
          RUST_LOG=warn "$bin/myquic2-client" --config config-client.toml >client.log 2>&1 & client_pid=$!
          sleep 2
          cleanup() { kill "$server_pid" "$client_pid" "$echo_pid" "$techo_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          "$bench" tcpecho 127.0.0.1:1080 127.0.0.1:19291 262144 | tail -n1
          "$bench" tcp 127.0.0.1:1080 127.0.0.1:19291 200 4 | tail -n1
          "$bench" udpsweep 127.0.0.1:1080 127.0.0.1:19290 64 8,512,2000,8000 1 | tail -n1
          "$bench" udpps 127.0.0.1:1080 127.0.0.1:19290 2 128 | tail -n1

          # Both binaries handle SIGTERM by returning from main, which is what
          # makes the profile runtime flush their .profraw files.
          kill -TERM "$server_pid" "$client_pid"
          wait "$server_pid" || true
          wait "$client_pid" || true
          cleanup
          trap - EXIT
          ls -l "$PROFILE_DIR"
      - name: Merge profile data
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-musl
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          profdata="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-profdata"
          count=$(ls "$PROFILE_DIR"/*.profraw | wc -l)
          echo "raw profiles: $count"
          [ "$count" -ge 2 ] || { echo "expected profiles from both server and client"; exit 1; }
          "$profdata" merge -o "$PROFILE_DIR/merged.profdata" "$PROFILE_DIR"/*.profraw
          ls -l "$PROFILE_DIR/merged.profdata"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pgo-profile-musl
          path: ${{ runner.temp }}/pgo-musl/merged.profdata
          if-no-files-found: error
          retention-days: 1

  pgo-gnu:
    name: PGO training (gnu)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: pgo-gnu
      - name: Build instrumented binaries and training harness
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-gnu
          # An explicit --target keeps host units (build scripts, proc
          # macros) out of the instrumented build; the runner's own glibc is
          # irrelevant to the profile.
          RUSTFLAGS: -C profile-generate=${{ runner.temp }}/pgo-gnu
        run: |
          set -euo pipefail
          mkdir -p "$PROFILE_DIR"
          cargo build --release \
            --target x86_64-unknown-linux-gnu \
            --bin myquic2-server --bin myquic2-client --example hotpath_bench
      - name: Train on loopback
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-gnu
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-gnu/release
          bench="$bin/examples/hotpath_bench"

          "$bench" echo 19290 >/dev/null 2>&1 & echo_pid=$!
          "$bench" techo 19291 >/dev/null 2>&1 & techo_pid=$!
          RUST_LOG=warn "$bin/myquic2-server" --config config-server.toml >server.log 2>&1 & server_pid=$!
          sleep 1
          RUST_LOG=warn "$bin/myquic2-client" --config config-client.toml >client.log 2>&1 & client_pid=$!
          sleep 2
          cleanup() { kill "$server_pid" "$client_pid" "$echo_pid" "$techo_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          "$bench" tcpecho 127.0.0.1:1080 127.0.0.1:19291 262144 | tail -n1
          "$bench" tcp 127.0.0.1:1080 127.0.0.1:19291 200 4 | tail -n1
          "$bench" udpsweep 127.0.0.1:1080 127.0.0.1:19290 64 8,512,2000,8000 1 | tail -n1
          "$bench" udpps 127.0.0.1:1080 127.0.0.1:19290 2 128 | tail -n1

          kill -TERM "$server_pid" "$client_pid"
          wait "$server_pid" || true
          wait "$client_pid" || true
          cleanup
          trap - EXIT
          ls -l "$PROFILE_DIR"
      - name: Merge profile data
        env:
          PROFILE_DIR: ${{ runner.temp }}/pgo-gnu
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          profdata="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-profdata"
          count=$(ls "$PROFILE_DIR"/*.profraw | wc -l)
          echo "raw profiles: $count"
          [ "$count" -ge 2 ] || { echo "expected profiles from both server and client"; exit 1; }
          "$profdata" merge -o "$PROFILE_DIR/merged.profdata" "$PROFILE_DIR"/*.profraw
          ls -l "$PROFILE_DIR/merged.profdata"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pgo-profile-gnu
          path: ${{ runner.temp }}/pgo-gnu/merged.profdata
          if-no-files-found: error
          retention-days: 1

  build-musl:
    name: Static musl OpenWrt x86_64 (${{ matrix.level }})
    needs: [verify, pgo-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x86-64
            level: v1
            generic: true
          - cpu: x86-64-v2
            level: v2
            generic: false
          - cpu: x86-64-v3
            level: v3
            generic: false
          - cpu: x86-64-v4
            level: v4
            generic: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: openwrt-${{ matrix.level }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgo-profile-musl
          path: ${{ runner.temp }}/pgo-musl
      - name: Build static binaries (PGO, target-cpu=${{ matrix.cpu }})
        env:
          PGO_PROFILE: ${{ runner.temp }}/pgo-musl/merged.profdata
        run: |
          cargo zigbuild --release \
            --target x86_64-unknown-linux-musl \
            --config "target.x86_64-unknown-linux-musl.rustflags=[\"-C\", \"target-cpu=${{ matrix.cpu }}\", \"-C\", \"profile-use=$PGO_PROFILE\"]" \
            --bin myquic2-server --bin myquic2-client
      - name: Package tarballs
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          level="${{ matrix.level }}"
          mkdir -p pkg artifacts

          openwrt="myquic2-${tag}-openwrt-x86_64-${level}"
          mkdir -p "pkg/${openwrt}"
          cp target/x86_64-unknown-linux-musl/release/myquic2-server "pkg/${openwrt}/myquic2-server-${level}"
          cp target/x86_64-unknown-linux-musl/release/myquic2-client "pkg/${openwrt}/myquic2-client-${level}"
          cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${openwrt}/"
          cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${openwrt}/"
          tar -C pkg -czf "artifacts/${openwrt}.tar.gz" "${openwrt}"

          # The v1 build is the safe default for every x86-64 CPU, so it is
          # also published under a generic static-Linux name.
          if [ "${{ matrix.generic }}" = "true" ]; then
            generic="myquic2-${tag}-x86_64-unknown-linux-musl"
            mkdir -p "pkg/${generic}"
            cp target/x86_64-unknown-linux-musl/release/myquic2-server "pkg/${generic}/"
            cp target/x86_64-unknown-linux-musl/release/myquic2-client "pkg/${generic}/"
            cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${generic}/"
            cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${generic}/"
            tar -C pkg -czf "artifacts/${generic}.tar.gz" "${generic}"
          fi

          ls -lh artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: myquic2-release-musl-${{ matrix.level }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-gnu:
    name: x86_64-unknown-linux-gnu
    needs: [verify, pgo-gnu]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-gnu
      # Zig + cargo-zigbuild pin the gnu artifact to a glibc 2.36 symbol floor:
      # Debian 12 is the minimum supported glibc distro. A plain `cargo build`
      # on ubuntu-latest links against that runner's glibc (2.39 on Ubuntu
      # 24.04) and produced a binary that refused to start on Debian 12 with
      # `GLIBC_2.38 not found`; the 2.36 floor keeps the system-linked
      # artifact usable on glibc >= 2.36 (Debian 12+, Ubuntu 23.04+,
      # Fedora 37+, RHEL 10+) while staying a normal dynamically-linked build.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-gnu
      - uses: actions/download-artifact@v8.0.1
        with:
          name: pgo-profile-gnu
          path: ${{ runner.temp }}/pgo-gnu
      - name: Build release binaries (PGO, glibc 2.36 floor)
        env:
          # RUSTFLAGS (rather than a per-target config array) because the
          # versioned `.2.36` zigbuild target would need the version in the
          # config key; with an explicit --target, RUSTFLAGS reaches exactly
          # the target artifacts and leaves host build scripts untouched.
          RUSTFLAGS: -C profile-use=${{ runner.temp }}/pgo-gnu/merged.profdata
        run: |
          cargo zigbuild --release \
            --target x86_64-unknown-linux-gnu.2.36 \
            --bin myquic2-server --bin myquic2-client
      - name: Package tarball
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          name="myquic2-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "pkg/${name}" artifacts
          cp target/x86_64-unknown-linux-gnu/release/myquic2-server "pkg/${name}/"
          cp target/x86_64-unknown-linux-gnu/release/myquic2-client "pkg/${name}/"
          cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${name}/"
          cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${name}/"
          tar -C pkg -czf "artifacts/${name}.tar.gz" "${name}"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: myquic2-release-gnu
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-musl, build-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: myquic2-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
