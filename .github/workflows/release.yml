name: Release

# Publishes a GitHub Release with ready-to-run x86_64 Linux binaries.
#
# Trigger: push a tag like `v0.1.0`, or run the workflow manually and pass
# the tag (the tag is created from the selected commit if it does not exist).
#
# Assets:
#   myquic2-<tag>-x86_64-unknown-linux-musl.tar.gz   static, any x86_64 Linux
#   myquic2-<tag>-x86_64-unknown-linux-gnu.tar.gz    glibc build
#   myquic2-<tag>-openwrt-x86_64-v1..v4.tar.gz       static musl, CPU levels
#   SHA256SUMS                                       checksums for all assets
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: verify
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (no default features)
        run: cargo test --all-targets --no-default-features

  build-musl:
    name: Static musl OpenWrt x86_64 (${{ matrix.level }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x86-64
            level: v1
            generic: true
          - cpu: x86-64-v2
            level: v2
            generic: false
          - cpu: x86-64-v3
            level: v3
            generic: false
          - cpu: x86-64-v4
            level: v4
            generic: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: openwrt-${{ matrix.level }}
      - name: Build static binaries (target-cpu=${{ matrix.cpu }})
        run: |
          cargo zigbuild --release \
            --target x86_64-unknown-linux-musl \
            --config 'target.x86_64-unknown-linux-musl.rustflags=["-C", "target-cpu=${{ matrix.cpu }}"]' \
            --bin myquic2-server --bin myquic2-client
      - name: Package tarballs
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          level="${{ matrix.level }}"
          mkdir -p pkg artifacts

          openwrt="myquic2-${tag}-openwrt-x86_64-${level}"
          mkdir -p "pkg/${openwrt}"
          cp target/x86_64-unknown-linux-musl/release/myquic2-server "pkg/${openwrt}/myquic2-server-${level}"
          cp target/x86_64-unknown-linux-musl/release/myquic2-client "pkg/${openwrt}/myquic2-client-${level}"
          cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${openwrt}/"
          cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${openwrt}/"
          tar -C pkg -czf "artifacts/${openwrt}.tar.gz" "${openwrt}"

          # The v1 build is the safe default for every x86-64 CPU, so it is
          # also published under a generic static-Linux name.
          if [ "${{ matrix.generic }}" = "true" ]; then
            generic="myquic2-${tag}-x86_64-unknown-linux-musl"
            mkdir -p "pkg/${generic}"
            cp target/x86_64-unknown-linux-musl/release/myquic2-server "pkg/${generic}/"
            cp target/x86_64-unknown-linux-musl/release/myquic2-client "pkg/${generic}/"
            cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${generic}/"
            cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${generic}/"
            tar -C pkg -czf "artifacts/${generic}.tar.gz" "${generic}"
          fi

          ls -lh artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: myquic2-release-musl-${{ matrix.level }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-gnu:
    name: x86_64-unknown-linux-gnu
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-gnu
      - name: Build release binaries
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-gnu \
            --bin myquic2-server --bin myquic2-client
      - name: Package tarball
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          name="myquic2-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "pkg/${name}" artifacts
          cp target/x86_64-unknown-linux-gnu/release/myquic2-server "pkg/${name}/"
          cp target/x86_64-unknown-linux-gnu/release/myquic2-client "pkg/${name}/"
          cp dist/openwrt-x86_64/config-server.toml.sample "pkg/${name}/"
          cp dist/openwrt-x86_64/config-client.toml.sample "pkg/${name}/"
          tar -C pkg -czf "artifacts/${name}.tar.gz" "${name}"
          ls -lh artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: myquic2-release-gnu
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-musl, build-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: myquic2-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
