[package]
name = "myquic2"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "MyQUIC2 ultra-high-performance QUIC SOCKS5 proxy"
license = "MIT"

[lib]
name = "myquic2"
path = "src/lib.rs"

[[bin]]
name = "myquic2-server"
path = "src/bin/myquic2-server/main.rs"

[[bin]]
name = "myquic2-client"
path = "src/bin/myquic2-client/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
# quinn trio from crates.io (0.11 line): quinn 0.11.12 / quinn-proto 0.11.18 /
# quinn-udp 0.5.x. 0.11.18 backports the DATAGRAM accounting fix and the
# assembler contiguous-chunk coalescing, so no fork is needed; the custom
# MAX_CHUNKS=16384 fork patch is intentionally dropped (1024 returns, hence
# the 0-RTT flow below keys on `ZeroRttAccepted`, the 0.11 API).
# quinn trio pinned EXACTLY (=0.11.12): `udp::send::poll_once` /
# `try_send_datagram` correctness is verified against the 0.11.12
# `connection.rs` `SendDatagram` internals (one state-lock per poll,
# `Notified` Drop unregisters the waiter). A caret float to a newer
# 0.11.x that changes those internals would silently break the
# `Blocked`-vs-parked contract, so the pin is load-bearing.
quinn = "=0.11.12"
rustls = { version = "0.23", features = ["ring", "std", "logging"] }
rcgen = "0.14"
time = "0.3"
rustls-pemfile = "2"
bytes = "1"
socket2 = "0.6"
libc = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
arc-swap = "1"
parking_lot = "0.12"
quanta = "0.13"

# mimalloc for musl targets only. The shipped static / OpenWrt binaries link
# musl, whose allocator measured ~22% behind glibc on the closed-loop UDP soak
# (149k vs 190k pps on the aarch64 test VM); mimalloc recovers about half the
# gap (+15%) and measured neutral on glibc, which keeps the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

# `test-util` backs the paused-clock regression test in the client bin
# (`udp_associate_serves_its_first_datagram_without_a_startup_sleep`); it is
# dev-only so release builds keep the minimal tokio feature set.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
