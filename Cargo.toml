[package]
name = "myquic2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MyQUIC2 ultra-high-performance QUIC SOCKS5 proxy"
license = "MIT"

[lib]
name = "myquic2"
path = "src/lib.rs"

[[bin]]
name = "myquic2-server"
path = "src/bin/myquic2-server.rs"

[[bin]]
name = "myquic2-client"
path = "src/bin/myquic2-client.rs"

[features]
default = ["stats"]
# Per-packet relay counters (`udp_stats`/`udp_write`). They are shared atomics:
# at a few hundred thousand packets per second the cache lines they own are
# ping-ponging between reader tasks and the reporter. `--no-default-features`
# compiles every one of them out of the hot path; the modules keep their API
# and report zeros, so the protocol's drop and reassembly warnings still work.
stats = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# quinn trio from crates.io (0.11 line): quinn 0.11.12 / quinn-proto 0.11.18 /
# quinn-udp 0.5.x. 0.11.18 backports the DATAGRAM accounting fix and the
# assembler contiguous-chunk coalescing, so no fork is needed; the custom
# MAX_CHUNKS=16384 fork patch is intentionally dropped (1024 returns, hence
# the 0-RTT flow below keys on `ZeroRttAccepted`, the 0.11 API).
quinn = "0.11.12"
rustls = { version = "0.23", features = ["ring", "std", "logging"] }
rcgen = "0.14"
time = "0.3"
rustls-pemfile = "2"
bytes = "1"
socket2 = "0.6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
arc-swap = "1"
# Lock-free concurrent map behind the client's connection-slot registry. The
# pool is written once at startup and read per TCP flow, so what matters is a
# read path that never takes a lock and never parks a runtime thread: a pin plus
# a hash lookup on an integer key. No slot is ever removed, so papaya's
# reclamation has nothing to collect on that path, and `seize` (its GC) spawns
# no threads — which matters for the router builds.
papaya = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
