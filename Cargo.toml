[package]
name = "myquic2"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
description = "MyQUIC2 ultra-high-performance QUIC SOCKS5 proxy"
license = "MIT"

[lib]
name = "myquic2"
path = "src/lib.rs"

[[bin]]
name = "myquic2-server"
path = "src/bin/myquic2-server/main.rs"

[[bin]]
name = "myquic2-client"
path = "src/bin/myquic2-client/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
# quinn trio from crates.io (0.11 line): quinn 0.11.x / quinn-proto 0.11.x /
# quinn-udp 0.5.x. The 0.11.18+ line backports the DATAGRAM accounting fix and
# the assembler contiguous-chunk coalescing, so no fork is needed; the custom
# MAX_CHUNKS=16384 fork patch is intentionally dropped (1024 returns, hence
# the 0-RTT flow below keys on `ZeroRttAccepted`, the 0.11 API).
# quinn floats on caret `0.11` (upgrades within the line via `cargo update`;
# `0.12` stays out by semver): `try_send_datagram` correctness rests on
# quinn's `SendDatagram` internals (one state-lock per poll, `Notified` Drop
# unregisters the waiter, `Blocked` parks the bytes back in the future for a
# `Pending` drop to release). Those internals are pinned behaviorally, not by
# version: `cancelled_datagram_waits_leave_no_residue` fails the build if a
# newer 0.11.x changes the `Blocked`-vs-parked contract, and the N=1
# per-frame-lock tests fail if the lock multiplicity moves. Re-verify this
# note against the new internals on every quinn bump that touches
# `connection.rs` `SendDatagram`.
# default-features = false drops `platform-verifier` (the client pins one
# self-signed certificate; nothing here calls the platform verifier) and
# selects the aws-lc-rs QUIC crypto backend instead of ring. `bloom` and
# `log` are quinn's own defaults; `runtime-tokio` is the runtime in use.
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "runtime-tokio",
    "bloom",
    "rustls-aws-lc-rs",
] }
# default-features = false: TLS 1.3 only (the `tls12` module is never
# negotiated) and no `prefer-post-quantum` (X25519MLKEM768 would enlarge every
# handshake; enable deliberately if PQ key exchange is wanted). The runtime
# provider is aws-lc-rs: on x86-64 it is the fastest of the two rustls
# backends for the per-packet AEAD/header-protection and handshake crypto,
# and it is the backend rustls itself defaults to.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "std",
    "logging",
] }
# Certificate generation is cold-path, but rcgen's default features pull ring
# in; pointing rcgen at aws-lc-rs keeps the whole dependency graph on a single
# crypto backend.
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
time = "0.3"
rustls-pemfile = "2"
bytes = "1"
socket2 = "0.6"
libc = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
arc-swap = "1"
parking_lot = "0.12"
# foldhash: the hasher for every in-process ad-hoc table whose keys are short
# and peer-influenced (server session table, client hub, DNS caches/inflight,
# the fragment reassembler's `(sess, id)` tables, the interactive-port set).
# std's SipHash-1-3 default costs ~5-8 ns per 4-byte lookup where this
# measures ~1-2 ns, and unlike `rustc-hash` (also in the tree) its
# `RandomState` carries a per-instance random seed, so a peer cannot
# precompute a colliding set. Already linked transitively (fastbloom ->
# quinn-proto), so declaring it adds no compile unit; `SipHash` remains only
# where a table is keyed by something longer than a few bytes or is genuinely
# cold.
foldhash = "0.2"
# futures-util: only `FutureExt::now_or_never`, the single non-blocking poll
# the DATAGRAM paths drive quinn's `send_datagram_wait` and `read_datagram`
# with (it replaced the hand-written `poll_once`). Already linked transitively
# (moka and hickory pull it), and `std` is a subset of the features the graph
# already enables, so the direct edge adds no compile unit.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# subtle: `ConstantTimeEq` for the auth-token comparison (replaces the
# hand-rolled `ct_eq` with the audited dalek-cryptography implementation).
# Already linked transitively by rustls at the same version, so the direct
# edge adds no compile unit; no default features are requested, so the feature
# set stays whatever rustls already selected.
subtle = { version = "2.6", default-features = false }
# zeroize: wipes the received auth-token buffer once compared (a bearer secret
# should not linger in freed heap memory; the client-side config token is a
# process-lifetime `String` and stays out of scope here). Already linked
# transitively (aws-lc-rs / rustls) with the `alloc` feature this uses, so the
# direct edge adds no compile unit.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
# thiserror: derive-only `Display`/`Error` for `mqp::error::MqpError`,
# replacing the hand-written impls (the derive keeps construction
# allocation-free: `Copy` variants carrying only `&'static str` / `u8`).
# Already linked transitively (quinn, hickory), so the direct edge adds no
# compile unit.
thiserror = "2"
# rand: replaces the hand-rolled xorshift64 in the client's reconnect jitter
# (`myquic2-client/util.rs::jitter_ms`) with the audited generator — one
# `rand::random_range(0..200)` per reconnect decision instead of a
# hand-seeded PRNG. Already linked transitively (hickory-resolver and
# quinn-proto both pull rand 0.10.3, and its default-feature deps —
# rand_core, chacha20, getrandom — are all in the current build), so the
# direct edge adds no compile unit and resolves to the same 0.10.3. Every
# call site is cold (dial/redial backoff and the per-association idle-tick
# phase), so the ChaCha12-backed `ThreadRng` costs nothing that matters;
# being per-thread seeded, it preserves the hand-rolled version's
# "concurrent clients do not share one backoff sequence" property.
rand = "0.10"
quanta = "0.13"
# Moka: the DNS caches and single-flight, replacing the hand-written
# sharded tables, batch eviction, owner/waiter protocol and the coalesce
# subsystem. `default-features = false` + `future` is the minimal surface:
# no `sync` public cache (the packet path reads the thread-local memo, and
# `moka::future::Cache` has no synchronous read view), no `quanta` (moka's
# quanta is 0.12; this crate already links 0.13 for its own clock — moka's
# docs say the feature makes no measurable difference since 0.12.10), no
# runtime feature (0.12 drives maintenance inline on cache operations).
# The hasher is swapped to foldhash via `build_with_hasher` (see
# `dns/store.rs`), so the DoS-resistance/seed story is the one Cargo.toml
# already documents for the DNS tables.
moka = { version = "0.12", default-features = false, features = ["future"] }
# Upstream DNS for the cold path (cache miss / first resolution). Replaces
# `tokio::net::lookup_host`, whose blocking `getaddrinfo` runs on the tokio
# blocking pool and cannot be cancelled by the 5 s timeout wrapper: the
# hickory lookup is a cancellable async future with its own connection reuse,
# so a resolution storm cannot pin blocking-pool threads past the deadline.
# `system-config` reads the platform's own configuration (resolv.conf on
# Linux/OpenWrt, the dynamic store on macOS); no crypto features are enabled —
# DNSSEC/DoT/DoH are deliberately off.
hickory-resolver = { version = "0.26", default-features = false, features = [
    "system-config",
    "tokio",
] }
# ipnet: the egress-policy deny lists (`dns/policy.rs::is_global_ip`) are CIDR
# data, not code. `Ipv4Net`/`Ipv6Net` with `contains` replaces the hand-rolled
# octet/mask chain this file had, whose history is a list of near-miss
# corrections (fe00::/9, 2001::/23, 3fff::/20 — each fixed in place because a
# bitmask can be wrong in a way a CIDR cannot). `new_assert` makes a bad
# prefix length a compile error. Packet-adjacent consumers memoize the
# verdict (`is_global_ip_cached`), so the linear scan runs on uncached
# addresses only. `std` and `serde` off: only `contains` is used.
ipnet = { version = "2", default-features = false }
# rustix: `net::sendmmsg` (feature `net`) replaces the hand-written
# `libc::mmsghdr` construction on the UDP send path (`udp/batch.rs`, both
# call sites are `#[cfg(target_os = "linux")]`). rustix owns the Linux/musl
# ABI quirks the hand-rolled version worked around (`msg_iovlen as _`,
# `MSG_DONTWAIT as _`) and type-checks the iovec/addr borrows, which removed
# four of the crate's `unsafe` blocks. `recvmmsg` stays hand-rolled: rustix
# lists it under `not_implemented::yet`, and `nix`'s `MultiHeaders`/`RecvMsg`
# iterator API is heavier than the fixed `mmsghdr` array that path needs.
# `std` for the `SocketAddrAny` conversions; the crate links everywhere but
# is only *called* on Linux. `time` is a hard requirement of `net` in
# rustix 1.1 (`net`'s sockopt code uses `crate::timespec`, which the `time`
# feature gates), so it must be enabled with it.
rustix = { version = "1", default-features = false, features = ["net", "std", "time"] }

# mimalloc on every target. The shipped static / OpenWrt binaries link musl,
# whose allocator measured ~22% behind glibc on the closed-loop UDP soak
# (149k vs 190k pps on the aarch64 test VM); mimalloc recovers about half the
# gap (+15%) and measured neutral on glibc. One allocator across targets keeps
# the dev machine and the deployed router on the same hot-path allocation
# profile, instead of a glibc-only behaviour difference in the field.
mimalloc = "0.1"

# `test-util` backs the paused-clock regression test in the client bin
# (`udp_associate_serves_its_first_datagram_without_a_startup_sleep`); it is
# dev-only so release builds keep the minimal tokio feature set.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
