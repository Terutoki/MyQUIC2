<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="MyQUIC2 README artwork">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#eef2ff"/><stop offset="1" stop-color="#f5f3ff"/>
  </linearGradient>
  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="cyanVioletV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="emeraldCyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.1" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="1" cy="0.1" r="0.7">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#0f172a" stroke-width="1" opacity="0.045"/>
  </pattern>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(15,23,42,0.10)"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<rect width="1600" height="1000" rx="26" fill="url(#bg)"/>
<rect width="1600" height="1000" rx="26" fill="url(#grid)"/>
<rect x="0" y="0" width="1600" height="1000" rx="26" fill="none" stroke="#dbe3f0" stroke-width="1.4" opacity="0.9"/>
<circle cx="192.0" cy="0" r="900.0" fill="url(#glowA)"/>
<circle cx="1600" cy="150.0" r="850.0" fill="url(#glowB)"/>
<rect x="80" y="54" width="190" height="34" rx="17.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><circle cx="94" cy="71.0" r="4" fill="#7c3aed"/><text x="106" y="74.96" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="start">FULL DUPLEX</text><text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#0f172a" text-anchor="start" letter-spacing="-1">Both ends can open a flow.</text><text x="82" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Client-owned and server-owned wire ids share one table. A steady frame is 2 B in either direction.</text><marker id="seqCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="seqViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="seqEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="seqAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker><marker id="seqRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/></marker><rect x="420" y="236" width="340" height="74" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="420" y="236" width="5" height="74" rx="2.5" fill="#0891b2"/><text x="442" y="266" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="800" fill="#0891b2" text-anchor="start" letter-spacing="1.5">CLIENT</text><text x="442" y="290" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">apps · SOCKS5 · registry</text><rect x="910" y="236" width="340" height="74" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="910" y="236" width="5" height="74" rx="2.5" fill="#7c3aed"/><text x="932" y="266" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="800" fill="#7c3aed" text-anchor="start" letter-spacing="1.5">SERVER</text><text x="932" y="290" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">auth · sessions · targets</text><line x1="590" y1="310" x2="590" y2="884" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.55"/><line x1="1080" y1="310" x2="1080" y2="884" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.55"/><text x="84" y="326" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#d97706" text-anchor="start" letter-spacing="1.4">HANDSHAKE</text><rect x="82" y="334" width="4" height="18" rx="2" fill="#d97706"/><line x1="82" y1="376" x2="1140" y2="376" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><text x="84" y="424" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#0891b2" text-anchor="start" letter-spacing="1.4">OPEN → ACK</text><rect x="82" y="432" width="4" height="18" rx="2" fill="#0891b2"/><line x1="82" y1="464" x2="1140" y2="464" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><text x="84" y="524" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#059669" text-anchor="start" letter-spacing="1.4">STEADY</text><rect x="82" y="532" width="4" height="18" rx="2" fill="#059669"/><line x1="82" y1="560" x2="1140" y2="560" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><text x="84" y="644" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#d97706" text-anchor="start" letter-spacing="1.4">DOMAIN REBIND</text><rect x="82" y="652" width="4" height="18" rx="2" fill="#d97706"/><line x1="82" y1="680" x2="1140" y2="680" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><text x="84" y="764" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="1.4">SERVER-OWNED</text><rect x="82" y="772" width="4" height="18" rx="2" fill="#7c3aed"/><line x1="82" y1="800" x2="1140" y2="800" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><text x="84" y="864" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" fill="#e11d48" text-anchor="start" letter-spacing="1.4">CLOSE</text><rect x="82" y="872" width="4" height="18" rx="2" fill="#e11d48"/><line x1="82" y1="900" x2="1140" y2="900" stroke="#dbe3f0" stroke-width="0.7" stroke-dasharray="2 8" opacity="0.8"/><line x1="590" y1="354" x2="1080" y2="354" stroke="#d97706" stroke-width="2.1"  stroke-dasharray="6 5" marker-end="url(#seqAmber)"/><rect x="766" y="324" width="139" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/><text x="835.0" y="340" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="middle">HELLO  wire_ver=2</text><line x1="1080" y1="374" x2="590" y2="374" stroke="#d97706" stroke-width="2.1"  stroke-dasharray="6 5" marker-end="url(#seqAmber)"/><rect x="783" y="386" width="104" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/><text x="835.0" y="402" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="middle">CAPS  limits</text><text x="84" y="390" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">async: not a first-packet gate</text><line x1="590" y1="452" x2="1080" y2="452" stroke="#0891b2" stroke-width="2.1"  marker-end="url(#seqCyan)"/><rect x="706" y="422" width="258" height="24" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="0.9"/><text x="835.0" y="438" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#0891b2" text-anchor="middle">DATA OPEN  sess + target + payload</text><line x1="1080" y1="486" x2="590" y2="486" stroke="#0891b2" stroke-width="2.1"  stroke-dasharray="6 5" marker-end="url(#seqCyan)"/><rect x="706" y="498" width="258" height="24" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="0.9"/><text x="835.0" y="514" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#0891b2" text-anchor="middle">FLOW_ACK  (or compressed downlink)</text><line x1="590" y1="566" x2="1080" y2="566" stroke="#059669" stroke-width="2.1"  marker-end="url(#seqEmerald)"/><rect x="758" y="536" width="153" height="24" rx="12" fill="#ffffff" stroke="#059669" stroke-width="0.9"/><text x="835.0" y="552" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">steady DATA  ·  2 B</text><line x1="1080" y1="598" x2="590" y2="598" stroke="#059669" stroke-width="2.1"  marker-end="url(#seqEmerald)"/><rect x="730" y="568" width="209" height="24" rx="12" fill="#ffffff" stroke="#059669" stroke-width="0.9"/><text x="835.0" y="584" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">steady DATA / TRAIN  ·  2 B</text><line x1="590" y1="680" x2="1080" y2="680" stroke="#d97706" stroke-width="2.1"  marker-end="url(#seqAmber)"/><rect x="783" y="650" width="104" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/><text x="835.0" y="666" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="middle">OPEN(domain)</text><line x1="1080" y1="712" x2="590" y2="712" stroke="#d97706" stroke-width="2.1"  stroke-dasharray="6 5" marker-end="url(#seqAmber)"/><rect x="724" y="724" width="223" height="24" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/><text x="835.0" y="740" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="middle">OPEN|SRC  actual reply source</text><text x="84" y="730" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">then 2 B both ways · source changes rebind</text><line x1="1080" y1="806" x2="590" y2="806" stroke="#7c3aed" stroke-width="2.1"  marker-end="url(#seqViolet)"/><rect x="724" y="776" width="223" height="24" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="0.9"/><text x="835.0" y="792" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">OPEN|SRC  owner=1 · full-cone</text><line x1="590" y1="838" x2="1080" y2="838" stroke="#7c3aed" stroke-width="2.1"  marker-end="url(#seqViolet)"/><rect x="741" y="808" width="188" height="24" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="0.9"/><text x="835.0" y="824" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">app reply on the SAME id</text><line x1="590" y1="906" x2="1080" y2="906" stroke="#e11d48" stroke-width="2.1"  marker-end="url(#seqRose)"/><rect x="790" y="918" width="90" height="24" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="0.9"/><text x="835.0" y="934" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#e11d48" text-anchor="middle">SESS_CLOSE</text><line x1="1080" y1="926" x2="590" y2="926" stroke="#e11d48" stroke-width="2.1"  marker-end="url(#seqRose)"/><rect x="790" y="938" width="90" height="24" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="0.9"/><text x="835.0" y="954" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#e11d48" text-anchor="middle">SESS_CLOSE</text><rect x="1228" y="430" width="300" height="138" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="1228" y="430" width="5" height="138" rx="2.5" fill="#0891b2"/><text x="1250" y="460" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#0891b2" text-anchor="start" letter-spacing="1.2">NO SESSION ON THE WIRE</text><text x="1250" y="490.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A steady frame is just an id</text><text x="1250" y="507.825" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">and a payload — the session id</text><text x="1250" y="525.65" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">appears only in OPEN, INLINE</text><text x="1250" y="543.475" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">and CTL.</text><rect x="1228" y="588" width="300" height="138" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="1228" y="588" width="5" height="138" rx="2.5" fill="#d97706"/><text x="1250" y="618" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#d97706" text-anchor="start" letter-spacing="1.2">ACK IS AN OPTIMISATION</text><text x="1250" y="648.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A lost FLOW_ACK never blocks</text><text x="1250" y="665.825" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">delivery. It only delays</text><text x="1250" y="683.65" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">compression; payloads keep</text><text x="1250" y="701.475" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">flowing as OPEN.</text><rect x="1228" y="746" width="300" height="138" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="1228" y="746" width="5" height="138" rx="2.5" fill="#e11d48"/><text x="1250" y="776" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="start" letter-spacing="1.2">CLOSE PURGES EVERYTHING</text><text x="1250" y="806.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">SESS_CLOSE / FLOW_CLOSE</text><text x="1250" y="823.825" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">release bindings, queued</text><text x="1250" y="841.65" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">stager items and in-flight</text><text x="1250" y="859.475" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">partials on both ends.</text><rect x="80" y="200" width="300" height="28" rx="14.0" fill="#cffafe" stroke="none" stroke-width="1"/><text x="94" y="217.6" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#0891b2" text-anchor="start">optimistic first packet · no CAPS wait</text></svg>