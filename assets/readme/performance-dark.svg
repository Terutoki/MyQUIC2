<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-label="MyQUIC2 README artwork">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a12"/><stop offset="0.55" stop-color="#0b1220"/><stop offset="1" stop-color="#111028"/>
  </linearGradient>
  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cyanVioletV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="emeraldCyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.1" cy="0.0" r="0.75">
