<rect x="80" y="54" width="190" height="34" rx="17.0" fill="#022c22" stroke="#34d399" stroke-width="1"/><circle cx="94" cy="71.0" r="4" fill="#34d399"/><text x="106" y="74.96" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="start">PERFORMANCE</text><text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9" text-anchor="start" letter-spacing="-1">Small packets, measured.</text><text x="82" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="start">Header bytes and send counts from the shipped release binaries; the Linux netem matrix remains the deployment gate.</text><rect x="80" y="216" width="336" height="108" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><rect x="80" y="216" width="5" height="108" rx="2.5" fill="#22d3ee"/><text x="104" y="262" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="800" fill="#22d3ee" text-anchor="start">2 B</text><text x="104" y="288" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="start">steady DATA header</text><text x="104" y="308" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">id &lt; 128</text><rect x="443" y="216" width="336" height="108" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><rect x="443" y="216" width="5" height="108" rx="2.5" fill="#a78bfa"/><text x="467" y="262" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="800" fill="#a78bfa" text-anchor="start">8 B</text><text x="467" y="288" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="start">steady FRAG header</text><text x="467" y="308" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">was 18–30 B</text><rect x="806" y="216" width="336" height="108" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><rect x="806" y="216" width="5" height="108" rx="2.5" fill="#34d399"/><text x="830" y="262" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="800" fill="#34d399" text-anchor="start">0.743</text><text x="830" y="288" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="start">frames / payload</text><text x="830" y="308" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">8 associations</text><rect x="1169" y="216" width="336" height="108" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><rect x="1169" y="216" width="5" height="108" rx="2.5" fill="#fbbf24"/><text x="1193" y="262" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="800" fill="#fbbf24" text-anchor="start">−25%</text><text x="1193" y="288" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f1f5f9" text-anchor="start">client DATAGRAM sends</text><text x="1193" y="308" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">vs v0.2.0 wire</text><rect x="80" y="360" width="700" height="422" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><text x="104" y="398" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.4">HEADER BYTES</text><text x="104" y="428" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#f1f5f9" text-anchor="start">What the framing costs</text><text x="104" y="486" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">steady DATA</text><text x="756" y="486" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="end">5–6 B → 2 B</text><rect x="270" y="472" width="320" height="10" rx="5" fill="#0b1220"/><rect x="270" y="472" width="64" height="10" rx="5" fill="#334155" opacity="0.6"/><rect x="270" y="486" width="21" height="10" rx="5" fill="#22d3ee"/><text x="104" y="544" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">TRAIN header</text><text x="756" y="544" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="end">6 B → 3 B</text><rect x="270" y="530" width="320" height="10" rx="5" fill="#0b1220"/><rect x="270" y="530" width="64" height="10" rx="5" fill="#334155" opacity="0.6"/><rect x="270" y="544" width="32" height="10" rx="5" fill="#22d3ee"/><text x="104" y="602" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">TRAIN item</text><text x="756" y="602" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="end">2 B → 1 B</text><rect x="270" y="588" width="320" height="10" rx="5" fill="#0b1220"/><rect x="270" y="588" width="21" height="10" rx="5" fill="#334155" opacity="0.6"/><rect x="270" y="602" width="11" height="10" rx="5" fill="#22d3ee"/><text x="104" y="660" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">TRAIN dict header</text><text x="756" y="660" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="end">6 B → 4 B</text><rect x="270" y="646" width="320" height="10" rx="5" fill="#0b1220"/><rect x="270" y="646" width="64" height="10" rx="5" fill="#334155" opacity="0.6"/><rect x="270" y="660" width="43" height="10" rx="5" fill="#22d3ee"/><text x="104" y="718" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="start">FRAG header</text><text x="756" y="718" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="end">18–30 B → 8 B</text><rect x="270" y="704" width="320" height="10" rx="5" fill="#0b1220"/><rect x="270" y="704" width="320" height="10" rx="5" fill="#334155" opacity="0.6"/><rect x="270" y="718" width="85" height="10" rx="5" fill="#22d3ee"/><text x="104" y="756" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">faded = v0.2.0  ·  bright = MQP-3 rev2</text><rect x="812" y="360" width="708" height="200" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><text x="836" y="398" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="start" letter-spacing="1.2">CLIENT SENDS PER 1,000 PAYLOADS</text><text x="836" y="428" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f1f5f9" text-anchor="start">Fewer DATAGRAMs, not fewer bytes</text><text x="836" y="470" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">v0.2.0 wire</text><rect x="962" y="456" width="420" height="18" rx="9" fill="#0b1220"/><rect x="962" y="456" width="420" height="18" rx="9" fill="#64748b"/><text x="1398.0" y="470" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">994</text><text x="836" y="514" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start">MQP-3 rev2</text><rect x="962" y="500" width="420" height="18" rx="9" fill="#0b1220"/><rect x="962" y="500" width="314" height="18" rx="9" fill="#34d399"/><text x="1291.943661971831" y="514" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="start">743</text><text x="1496" y="514" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="800" fill="#34d399" text-anchor="end">−25%</text><rect x="812" y="580" width="708" height="202" rx="18" fill="#0f172a" stroke="#243149" stroke-width="1.2" filter="url(#softShadow)" /><text x="836" y="618" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1.2">LOOPBACK SMOKE · RELEASE</text><text x="836" y="644" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">8 assoc × 1000 pps × 128 B × 65 s</text><text x="1242" y="644" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="start">519,992 / 519,990</text><text x="1496" y="644" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="end">0.000% loss</text><text x="836" y="676" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">udppaced · 128 B @ 5k pps</text><text x="1242" y="676" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="start">325,000 / 325,000</text><text x="1496" y="676" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="end">0.000% loss</text><text x="836" y="708" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">udpsweep · 8 B … 8 KiB</text><text x="1242" y="708" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="start">ALL OK</text><text x="1496" y="708" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="end">0 lost</text><text x="836" y="740" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="start">udpbidir · full duplex</text><text x="1242" y="740" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#f1f5f9" text-anchor="start">30,000 / 30,000</text><text x="1496" y="740" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="end">0.000% loss</text><text x="80" y="830" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">macOS loopback, release binaries, no netem: the percentages model the protocol; the pps/CPU target numbers come from scripts/linux-bench-matrix.sh on Linux.</text></svg>