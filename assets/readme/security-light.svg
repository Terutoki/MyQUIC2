<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-label="MyQUIC2 README artwork">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#eef2ff"/><stop offset="1" stop-color="#f5f3ff"/>
  </linearGradient>
  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="cyanVioletV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="emeraldCyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.1" cy="0.0" r="0.75">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="1" cy="0.1" r="0.7">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#0f172a" stroke-width="1" opacity="0.045"/>
  </pattern>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(15,23,42,0.10)"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<rect width="1600" height="780" rx="26" fill="url(#bg)"/>
<rect width="1600" height="780" rx="26" fill="url(#grid)"/>
<rect x="0" y="0" width="1600" height="780" rx="26" fill="none" stroke="#dbe3f0" stroke-width="1.4" opacity="0.9"/>
<circle cx="192.0" cy="0" r="702.0" fill="url(#glowA)"/>
<circle cx="1600" cy="117.0" r="663.0" fill="url(#glowB)"/>
<rect x="80" y="54" width="190" height="34" rx="17.0" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/><circle cx="94" cy="71.0" r="4" fill="#e11d48"/><text x="106" y="74.96" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#e11d48" text-anchor="start">SECURITY MODEL</text><text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#0f172a" text-anchor="start" letter-spacing="-1">Locked down by default.</text><text x="82" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Encrypted transport, per-packet authorization, and a deliberately small attack surface. Full-cone is opt-in.</text><rect x="80" y="224" width="420" height="290" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="80" y="224" width="5" height="290" rx="2.5" fill="#059669"/><text x="104" y="258" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="start" letter-spacing="1.4">ROUTER · OPENWRT</text><text x="104" y="290" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">client side</text><rect x="104" y="316" width="372" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><circle cx="122" cy="333" r="4" fill="#0891b2"/><text x="134" y="338" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">LAN apps</text><rect x="104" y="362" width="372" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><circle cx="122" cy="379" r="4" fill="#7c3aed"/><text x="134" y="384" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">SOCKS5 :1080</text><rect x="104" y="408" width="372" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><circle cx="122" cy="425" r="4" fill="#059669"/><text x="134" y="430" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">UDP hub 4032</text><rect x="104" y="464" width="150" height="28" rx="14.0" fill="#d1fae5" stroke="none" stroke-width="1"/><text x="118" y="481.6" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#059669" text-anchor="start">one UDP socket / slot</text><rect x="560" y="224" width="480" height="290" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="578" y="268" width="444" height="192" rx="40" fill="#ffffff" stroke="url(#cyanViolet)" stroke-width="2"/><path d="M 800.0 304 L 834.0 320 L 830.0 362 C 826.0 384, 810.0 396, 800.0 402 C 790.0 396, 774.0 384, 770.0 362 L 766.0 320 Z" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><path d="M 790.0 354 L 798.0 362 L 812.0 344" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="800.0" y="422" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">QUIC · TLS 1.3</text><text x="800.0" y="444" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">ALPN h3  ·  token on 1-RTT only</text><marker id="secCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><path d="M 508 370 C 540 370, 518 370, 550 370" stroke="#0891b2" stroke-width="2.4" fill="none" marker-end="url(#secCyan)"/><path d="M 1048 370 C 1078 370, 1028 370, 1060 370" stroke="#0891b2" stroke-width="2.4" fill="none" marker-end="url(#secCyan)"/><rect x="1070" y="224" width="450" height="290" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="1070" y="224" width="5" height="290" rx="2.5" fill="#7c3aed"/><text x="1094" y="258" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="1.4">VPS · SERVER</text><text x="1094" y="290" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="start">authenticated ingress</text><rect x="1094" y="320" width="402" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><text x="1108" y="335" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#475569" text-anchor="start">token auth</text><text x="1230" y="335" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">constant-time · ≤ 256 B</text><rect x="1094" y="365" width="402" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><text x="1108" y="380" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#475569" text-anchor="start">admission</text><text x="1230" y="380" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">conn + memory caps</text><rect x="1094" y="410" width="402" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><text x="1108" y="425" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#475569" text-anchor="start">session table</text><text x="1230" y="425" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">8192 · per-packet allowlist</text><rect x="1094" y="455" width="402" height="34" rx="18" fill="#f8fafc" stroke="#dbe3f0" stroke-width="1.2" /><text x="1108" y="470" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#475569" text-anchor="start">target policy</text><text x="1230" y="470" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start">SSRF / private-IP filter</text><rect x="80" y="560" width="710" height="88" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="80" y="560" width="5" height="88" rx="2.5" fill="#0891b2"/><text x="104" y="587" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#0891b2" text-anchor="start" letter-spacing="1.2">EVERY PACKET IS AUTHORIZED</text><text x="104" y="612" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">No compressed id can route without a live binding. Unknown ids drop that item, never guess.</text><circle cx="760" cy="584" r="4" fill="#0891b2"/><rect x="816" y="560" width="710" height="88" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="816" y="560" width="5" height="88" rx="2.5" fill="#059669"/><text x="840" y="587" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#059669" text-anchor="start" letter-spacing="1.2">16-ENTRY IP ALLOWLIST</text><text x="840" y="612" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Reply sources are checked against the session ring, with the exact live flow as the high-fanout fallback.</text><circle cx="1496" cy="584" r="4" fill="#059669"/><rect x="80" y="664" width="710" height="88" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="80" y="664" width="5" height="88" rx="2.5" fill="#d97706"/><text x="104" y="691" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#d97706" text-anchor="start" letter-spacing="1.2">FULL-CONE IS OPT-IN</text><text x="104" y="716" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">udp_full_cone opens server-owned flows and forwards any source; off by default, warned at startup.</text><circle cx="760" cy="688" r="4" fill="#d97706"/><rect x="816" y="664" width="710" height="88" rx="18" fill="#ffffff" stroke="#dbe3f0" stroke-width="1.2" filter="url(#softShadow)" /><rect x="816" y="664" width="5" height="88" rx="2.5" fill="#7c3aed"/><text x="840" y="691" font-family="'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="1.2">NO PAYLOAD COMPRESSION</text><text x="840" y="716" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Encrypted/random UDP is left untouched; gains are framing, fewer frames, fewer sends.</text><circle cx="1496" cy="688" r="4" fill="#7c3aed"/></svg>