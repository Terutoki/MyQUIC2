# MyQUIC2 server config
listen = "[::]:8443"
cert_file = "server-cert.pem"
key_file = "server-key.pem"
server_name = "test.com"
congestion = "bbr"
gso = true
keep_alive_secs = 5
allow_private = true
# Shared secret clients must present (set on both sides).
# Leave empty to disable auth (then rely on firewall/network isolation).
auth_token = ""
# Admission. Unset max_connections = 4096 with a token above, 256 without one:
# a tokenless endpoint admits every peer, so its connection budget *is* the
# pre-auth budget. Clamped to 1..=4096; raising it tokenless is warned about.
# max_connections = 4096
# Optional cap, in MiB, on the peer-pinnable memory the admitted connections may
# represent. The process-wide UDP session pool is charged first — MAX_SESSIONS_
# GLOBAL (8192) x (2 x MYQUIC2_SESS_SOCKET_BUF + its reader buffer) = ~1.06 GiB
# at the shipped 64 KiB buffers — and what is left is divided by
# receive window + send budget + both DATAGRAM buffers + the reassembly budget
# = 8.25 MiB with the default 2/4/2 MB windows. Raising the windows therefore
# admits fewer connections instead of multiplying the memory ceiling, and a
# budget at or below the session pool admits exactly one connection (warned
# about at startup). The worst case (session pool + connections x
# per-connection figure) is logged at startup either way.
# max_peer_memory_mb = 512
# Default 2/4/2 MB matches code defaults; must mirror the client (download
# capped by receiver, upload by sender, so change both sides together).
# Omit all five to use defaults; 4/8/4 MB for ~240 Mb/s, 8/16/8 MB for 300 Mb/s peak.
# stream_receive_window_mb = 2
# receive_window_mb = 4
# send_window_mb = 2
# ack_threshold = 2
# max_ack_delay_ms = 5
# RTT seed in ms for the first PTO / initial pacing (default 190). Set it to
# the link RTT, e.g. 140 on a 140 ms link; steady state re-measures.
# initial_rtt_ms = 140
# ALPN (optional; omit = h3 masquerade). Must match the client;
# alpn="myquic2/2" restores the versioned identifier + skew fail-closed guard.
# alpn = "h3"
