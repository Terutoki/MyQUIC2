# MyQUIC2 server config
listen = "[::]:8443"
# Ingress endpoints: QUIC sockets sharing `listen` through SO_REUSEPORT, each
# with its own receive loop, CID table and accept path. Default: one per usable
# core on Linux, where the kernel spreads a connection's packets across the
# group by 4-tuple; 1 on other platforms (macOS delivers a REUSEPORT group to a
# single member, so extra endpoints there only cost sockets — the server warns
# when you ask for them anyway). Set 1 for the strict single socket.
# Trade-off: a member is pinned by the client's 4-tuple, so a client NAT rebind
# loses the connection (it redials) instead of migrating. Clamped to 1..=8.
# quic_endpoints = 4
cert_file = "server-cert.pem"
key_file = "server-key.pem"
server_name = "test.com"
congestion = "bbr"
gso = true
# NAT/firewall refresh cadence. This is not the liveness window; keep it short
# enough for the path's UDP mapping (5 s is safe on common 30-120 s NATs).
keep_alive_secs = 5
# Liveness window, decoupled from keepalive. Default 60 s: the client's silence
# watchdog is 2/3 of it (40 s) and its stale gate is 22 s. 15 restores the old
# fast behavior (~10 s watchdog); 90 widens the no-drop window to ~60 s. Values
# below 3 × keep_alive_secs are raised to that floor. Both sides advertise an
# idle timeout and QUIC uses the minimum, so keep this equal on both sides.
idle_timeout_secs = 60
allow_private = true
# Full-cone NAT semantics for the UDP relay (default false). When true, every
# UDP association's relay socket forwards replies from ANY source, not just the
# hosts that association has sent to, so the client app gets a public UDP
# endpoint that peers can initiate to (P2P games / WebRTC). This exposes that
# app's endpoint to unsolicited internet traffic — unsolicited datagrams are
# outside the auth_token boundary — and it only works if the server's ephemeral
# relay UDP ports are reachable through this host's firewall/NAT. There is no
# per-session inbound rate limit in this mode, and inbound traffic keeps the
# association alive. With allow_private = true above, an unsolicited or
# spoofed sender can also steer app replies toward private/loopback targets,
# so keep allow_private = false on public/multi-user servers.
# udp_full_cone = false
# Shared secret clients must present (set on both sides).
# Leave empty to disable auth (then rely on firewall/network isolation).
auth_token = ""
# Admission. Unset max_connections = 4096 with a token above, 256 without one:
# a tokenless endpoint admits every peer, so its connection budget *is* the
# pre-auth budget. Clamped to 1..=4096; raising it tokenless is warned about.
# max_connections = 4096
# Optional cap, in MiB, on the peer-pinnable memory the admitted connections may
# represent. The fixed process-wide terms are charged first — the UDP session
# pool: MAX_SESSIONS_GLOBAL (8192) x (2 x MYQUIC2_SESS_SOCKET_BUF + its reader
# buffer + the 22 KiB MQP-3 flow table + 2 KiB rev2 copy-on-write tables)
# = ~2.25 GiB on Linux (the kernel stores/returns SO_*BUF at twice the requested
# value), ~1.25 GiB where it does not double them; the per-endpoint buffers:
# ~19 MiB each on Linux (quinn's 2.875 MiB userspace receive scratch + 16 MiB
# kernel socket caps) x quic_endpoints; the TCP relay pumps: 2 x 16 KiB
# userspace per stream x MAX_STREAM_TASKS (512 MiB) PLUS the relay TCP socket
# kernel buffers at 144 KiB per flow by default (~2.25 GiB; set
# MYQUIC2_RELAY_SOCKET_BUF to cap them explicitly); the UDP retry pool (~34 MiB);
# the DNS slow-path waiters (~8.75 MiB); the datagram-worker thread scratch; and
# quinn's parked-header stream-reassembly metadata (4,096 x 1,024 x 96 B
# = 384 MiB) — together ~5.6 GiB at the Linux defaults. What is left is divided
# by 19.6875 MiB per connection at the default windows (14 MiB QUIC transport
# buffers + both reassemblers + stager + ingress state + flow registry + the
# pre-auth stream-assembler credit). Raising the windows therefore admits fewer
# connections instead of multiplying the memory ceiling, and a budget at or
# below the fixed terms admits exactly one connection (warned about at startup).
# The worst case (fixed terms + connections x per-connection figure) is logged
# at startup either way. Note the fixed term (~5.6 GiB at the Linux defaults,
# dominated by the session pool and the TCP relay kernel allowance) is charged
# first, so a small example like 512 would admit exactly one connection: size
# the budget above the fixed term or lower MYQUIC2_SESS_SOCKET_BUF /
# MYQUIC2_RELAY_SOCKET_BUF / quic_endpoints first.
# max_peer_memory_mb = 8192
# Default 4/8/4 MB matches code defaults; must mirror the client (download
# capped by receiver, upload by sender, so change both sides together).
# Omit all five to use defaults; the 2/4/2 MB low-memory preset (~114 Mb/s,
# 8.25 MiB per connection) suits RAM-tight hosts, and 8/16/8 MB gives 300 Mb/s
# peak at ~4x loaded latency.
# stream_receive_window_mb = 4
# receive_window_mb = 8
# send_window_mb = 4
# ack_threshold = 2
# max_ack_delay_ms = 5
# RTT seed in ms for the first PTO / initial pacing (default 190). Set it to
# the link RTT, e.g. 140 on a 140 ms link; steady state re-measures.
# initial_rtt_ms = 140
# Path MTU (max UDP payload) every new connection starts from, bytes, default
# 1200 = the QUIC floor (clamped 1200..=1472; lower values are raised to 1200,
# since QUIC forbids smaller packets). PMTU discovery is opportunistic, so at
# the default a busy connection sends 18-23% more packets and fragments UDP
# payloads above 1150 B. On a known path raise it — 1360 is 1388/1408 wire
# bytes after the IP+UDP headers, safe on WireGuard-1420 and similar tunnel
# paths; a known 1500-byte Ethernet path can use 1400/1472. Mirror the client.
# initial_mtu = 1400
# ALPN (optional; omit = h3 masquerade). Must match the client;
# alpn="myquic2/3" restores the versioned identifier + skew fail-closed guard.
# alpn = "h3"
